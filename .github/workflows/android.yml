name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  export-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/football-career-dynasty.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-career-dynasty-debug-apk
          path: build/football-career-dynasty.apk
          if-no-files-found: error

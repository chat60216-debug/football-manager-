name: Update real football database
on:
  push:
    paths:
      - "scripts/import_openfootballbase.py"
      - ".github/workflows/update-real-rosters.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"
permissions:
  contents: write
jobs:
  refresh-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download latest OpenFootballBase release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo florentfougeres/OpenFootballBase-Data --pattern "*-data.tar.gz"
          mkdir -p data/source
          tar -xzf openfootballbase-data.tar.gz -C data/source
          if [ -d data/source/data ]; then cp -a data/source/data/. data/; else cp -a data/source/. data/; fi
          find data -maxdepth 3 -type f | head -40
      - name: Build Godot roster database
        run: |
          python -m pip install --upgrade pip duckdb
          mkdir -p data
          python scripts/import_openfootballbase.py
      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/real_rosters.json /tmp/real_rosters.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/real_rosters.json data/real_rosters.json
          git add data/real_rosters.json
          if git diff --cached --quiet; then
            echo "Roster database is already current."
          else
            git commit -m "Update real 2026/27 club squads"
            git push origin HEAD:main
          fi

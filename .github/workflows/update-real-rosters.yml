name: Update real football database
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"
permissions:
  contents: write
jobs:
  refresh-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: cli/cli@v2
      - name: Download latest OpenFootballBase release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo florentfougeres/OpenFootballBase-Data --pattern "*-data.tar.gz"
          mkdir -p data/source
          tar -xzf openfootballbase-data.tar.gz -C data/source
          find data/source -maxdepth 3 -type f | head -40
      - name: Build Godot roster database
        run: |
          python -m pip install --upgrade pip duckdb
          mkdir -p data
          mv data/source/* data/ 2>/dev/null || true
          python scripts/import_openfootballbase.py
      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real_rosters.json
          if git diff --cached --quiet; then
            echo "Roster database is already current."
          else
            git commit -m "Update real 2026/27 club squads"
            git push
          fi
